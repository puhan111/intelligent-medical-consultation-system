# 开发环境专用配置
# 使用方式: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  # 本地 PostgreSQL 数据库（仅开发环境）
  # 生产环境请改用外部数据库（AWS RDS 等），在 .env 中配置连接信息即可
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${PROJECT_NAME:-app}-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: ${PROJECT_NAME:-app}:dev
    ports:
      - "${API_PORT:-8001}:${API_PORT:-8001}"
    environment:
      - ENV=development
      # 旧 .env 的宿主回环代理在容器内不可达；开发容器直连外部 API。
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - http_proxy=
      - https_proxy=
      - all_proxy=
    volumes:
      - ./app:/app/app
      - app-logs:/app/logs
      - ./scripts:/app/scripts
      - ./migrations:/app/migrations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Worker - 复用开发环境镜像
  celery-worker:
    image: ${PROJECT_NAME:-app}:dev
    environment:
      - ENV=development
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - http_proxy=
      - https_proxy=
      - all_proxy=
    volumes:
      - ./app:/app/app  # 挂载代码目录以支持热更新
      - app-logs:/app/logs
      - ./scripts:/app/scripts
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started

  # Celery Beat - 复用开发环境镜像
  celery-beat:
    image: ${PROJECT_NAME:-app}:dev
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started  # 确保先构建 app

  # Flower - 复用开发环境镜像
  flower:
    image: ${PROJECT_NAME:-app}:dev
    depends_on:
      - app  # 确保先构建 app
      
  # 在开发环境中禁用Nginx服务
  nginx:
    profiles:
      - donotstart

volumes:
  postgres-data:
    driver: local
